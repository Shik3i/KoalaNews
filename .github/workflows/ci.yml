name: CI Validation

on:
  push:
    branches: [ main, master, rewrite/go-sveltekit ]
  pull_request:
    branches: [ main, master, rewrite/go-sveltekit ]

jobs:
  frontend:
    name: Svelte Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: website/web/build/

  backend:
    name: Go Vet, Test & Build
    runs-on: ubuntu-latest
    needs: frontend

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: website/web/build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/koalanews ./cmd/koalanews

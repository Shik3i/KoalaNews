# Production-style stack for the Go + SvelteKit rewrite.
# website_legacy is deprecated/reference-only and is not started here.

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - koalanews
    restart: unless-stopped

  koalanews:
    build: ./website
    expose:
      - "3000"
    environment:
      - ADDR=:3000
      - DATABASE_URL=file:/data/koalanews-v2.db
      - SYNC_INTERVAL=${SYNC_INTERVAL:-15m}
      - SESSION_KEY=${SESSION_KEY:?set a random SESSION_KEY in .env}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - koalanews_data:/data
    restart: unless-stopped

volumes:
  koalanews_data:
  caddy_data:

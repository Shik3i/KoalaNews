version: "3.9"

services:
  koalanews:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - koalanews_data:/data
    restart: unless-stopped

volumes:
  koalanews_data:

version: "3.9"

services:
  koalanews:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@koalanews.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-admin}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - KOALANEWS_RETENTION_DAYS=${KOALANEWS_RETENTION_DAYS:-14}
      - KOALANEWS_CLEANUP_INTERVAL_HOURS=${KOALANEWS_CLEANUP_INTERVAL_HOURS:-24}
    volumes:
      - koalanews_data:/data
    restart: unless-stopped

volumes:
  koalanews_data:
